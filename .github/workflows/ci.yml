# tradadata-blog — CI: chặn lỗi, build image, push lên ghcr.io.
#
# Workflow này CỐ Ý KHÔNG deploy. Nó dừng lại ở chỗ đẩy image lên registry.
#
# Vì sao không deploy ở đây:
#   Cụm k8s nằm trong LAN nhà, chỉ vào được bằng SSH qua gateway public. Muốn
#   workflow này rollout thì phải nhét khoá riêng SSH vào secret của repo — tức
#   là ai có quyền write repo cũng viết được một workflow để moi khoá đó ra và
#   SSH thẳng vào LAN. Không đánh đổi như vậy chỉ để tiết kiệm một lệnh kubectl.
#
#   Việc rollout làm ở nơi đã có sẵn quyền vào cụm (xem "Cách rollout" dưới).
#
# ─── Secrets cần khai (Settings > Secrets and variables > Actions) ────────────
#   NEXT_PUBLIC_SUPABASE_URL           nhúng cứng vào bundle client lúc build
#   NEXT_PUBLIC_SUPABASE_ANON_KEY      nhúng cứng vào bundle client lúc build
#   SUPABASE_SERVICE_ROLE_KEY          `next build` prerender /blog, /category…
#                                      bằng cách query Supabase NGAY LÚC BUILD,
#                                      thiếu key thật là build fail với
#                                      "supabaseKey is required"
#   NEXT_PUBLIC_SERVICE_ACCOUNT_EMAIL  (tuỳ chọn) hiện ở trang admin/settings
#
#   KHÔNG cần secret SSH nào. Nếu repo còn SSH_PRIVATE_KEY / SSH_KNOWN_HOSTS /
#   SSH_USER / SSH_GATEWAY / K8S_HOST từ workflow deploy cũ thì xoá đi cho sạch.
#
# ─── Việc phải làm MỘT LẦN ────────────────────────────────────────────────────
# 1. Để package ghcr `tradadata-blog` sang PUBLIC
#    (Profile > Packages > tradadata-blog > Package settings > Change visibility).
#    Không làm bước này thì cụm không pull được image, phải tự tạo imagePullSecret:
#      kubectl create secret docker-registry ghcr-secret -n bizflow \
#        --docker-server=ghcr.io --docker-username=<user> \
#        --docker-password=<PAT scope read:packages>
# 2. Image chạy Next.js standalone bằng `node server.js`. Deployment mà khai
#    `command:`/`args:` kiểu `npm start` hay `next start` là container không boot.
#
# ─── Cách rollout sau khi CI xanh ─────────────────────────────────────────────
# Job build-push in ra sẵn lệnh ở phần Summary của run. Đại ý:
#   kubectl set image deployment/tradadata blog=<image> -n bizflow
#   kubectl rollout status deployment/tradadata -n bizflow --timeout=10m
#   curl -s https://www.tradadata.com/api/health   # `version` phải đúng commit SHA
#
# ⚠️ Container `blog` nằm CHUNG 1 pod với `ke-truyen` và Deployment dùng
#    `strategy: Recreate` ⇒ rollout blog thì truyen.tradadata.com cũng downtime
#    ~1-2 phút. Báo trước cho ai cần biết.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: tradadata-blog-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Repo chưa có test tự động. Hai cổng chắn ở đây là typecheck và lint — chạy
  # riêng vì chúng xong trong ~1 phút, còn build Docker mất ~10 phút. Hỏng type
  # thì biết ngay chứ không phải chờ hết build.
  #
  # `next.config.ts` đã bật cả `eslint` lẫn `typescript` làm cổng chặn build
  # (189 lỗi eslint đã dọn sạch), nên job này trùng lặp một phần với `next build`
  # trong Dockerfile — cố ý, để lấy phản hồi nhanh.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20' # khớp với node:20-alpine trong Dockerfile
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      # CỐ Ý là `eslint src`, KHÔNG phải `npm run lint`. Script `lint` trong
      # package.json là `eslint` không tham số ⇒ soát cả repo, kể cả mấy script
      # tiện tay ở gốc (`tao-anh-bia.js`, `test-send-emails.js`, `submit-index.mjs`)
      # dùng `require()` → 40 lỗi no-require-imports, đỏ vĩnh viễn.
      # `next build` chỉ lint trong `src/`, nên lint đúng `src` để CI chặn đúng
      # cái mà build chặn, không hơn. Còn 63 warning trong src — warning không
      # chặn build, dọn dần.
      - name: Lint
        run: npx eslint src

  build-push:
    needs: check
    # Không build Docker cho PR: image Next.js tốn ~10 phút mỗi lần, và PR từ
    # fork KHÔNG được cấp secret nên `next build` sẽ chết ở bước prerender
    # Supabase. PR vẫn được chặn bởi job `check` ở trên.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Đăng nhập ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tính tên image (ghcr yêu cầu chữ thường)
        id: meta
        run: |
          REPO_LC=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${REPO_LC}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "repo_lc=${REPO_LC}" >> "$GITHUB_OUTPUT"

      # Service role key đi qua BuildKit secret chứ không qua --build-arg, để nó
      # KHÔNG nằm lại trong layer hay history của image.
      - name: Ghi service role key ra file để mount làm BuildKit secret
        run: |
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::error::Thiếu secret SUPABASE_SERVICE_ROLE_KEY — next build sẽ chết với 'supabaseKey is required'."
            exit 1
          fi
          printf '%s' "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" > /tmp/supabase_srk
          chmod 600 /tmp/supabase_srk

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=https://www.tradadata.com
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SERVICE_ACCOUNT_EMAIL=${{ secrets.NEXT_PUBLIC_SERVICE_ACCOUNT_EMAIL }}
            APP_VERSION=${{ github.sha }}
          secret-files: |
            supabase_service_role_key=/tmp/supabase_srk
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_lc }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_lc }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dọn secret tạm
        if: always()
        run: rm -f /tmp/supabase_srk

      # CI dừng ở đây. In sẵn lệnh rollout ra Summary để người có quyền vào cụm
      # copy-paste, khỏi phải tự dò tên image.
      - name: Ghi lệnh rollout ra Summary
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          {
            echo "## Image đã đẩy lên ghcr"
            echo
            echo '```'
            echo "$IMAGE"
            echo '```'
            echo
            echo "### Rollout vào cụm (cần quyền SSH vào cụm)"
            echo
            echo '```bash'
            echo "kubectl set image deployment/tradadata blog=$IMAGE -n bizflow"
            echo "kubectl rollout status deployment/tradadata -n bizflow --timeout=10m"
            echo '```'
            echo
            echo "### Nghiệm thu — bắt buộc"
            echo
            echo "Rollout xong KHÔNG có nghĩa là code mới đang phục vụ. Kiểm tra:"
            echo
            echo '```bash'
            echo "curl -s https://www.tradadata.com/api/health"
            echo '```'
            echo
            echo "\`version\` phải đúng bằng \`${{ github.sha }}\`."
            echo
            echo "> ⚠️ \`blog\` chung pod với \`ke-truyen\`, strategy \`Recreate\` ⇒ truyen.tradadata.com cũng downtime ~1-2 phút."
          } >> "$GITHUB_STEP_SUMMARY"
