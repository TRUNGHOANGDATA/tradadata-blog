# tradadata-blog — CI/CD: build image, push lên ghcr.io, rollout vào cụm k8s nhà
# (namespace `bizflow`, Deployment `tradadata`, container `blog`).
#
# Cùng pattern với repo ke-truyen: build/push chạy trên runner GitHub, bước deploy
# chỉ gửi vài lệnh kubectl qua SSH nên không cần self-hosted runner.
#
# ⚠️ DEPLOY TỰ ĐỘNG mỗi push vào main. Container `blog` và `ke-truyen` nằm CHUNG
#    1 pod với `strategy: Recreate`, nên mỗi lần deploy blog thì
#    truyen.tradadata.com cũng downtime ~1-2 phút, và ngược lại.
#    Không muốn tự động thì xoá khối `push:` bên dưới, chỉ giữ `workflow_dispatch`.
#
# ─── Secrets cần khai (Settings > Secrets and variables > Actions) ────────────
#   SSH_PRIVATE_KEY                    khoá riêng vào gateway + control plane
#   SSH_KNOWN_HOSTS                    output `ssh-keyscan` của gateway + control plane
#   SSH_USER                           user SSH
#   SSH_GATEWAY                        125.212.235.148  (gateway public, làm ProxyJump)
#   K8S_HOST                           192.168.1.250    (control plane, chỉ tới qua gateway)
#   NEXT_PUBLIC_SUPABASE_URL           nhúng vào bundle lúc build
#   NEXT_PUBLIC_SUPABASE_ANON_KEY      nhúng vào bundle lúc build
#   SUPABASE_SERVICE_ROLE_KEY          để prerender trang chủ / blog lúc build
#   NEXT_PUBLIC_SERVICE_ACCOUNT_EMAIL  (tuỳ chọn) hiện ở trang admin/settings
#
# ─── Việc phải làm MỘT LẦN trước khi chạy ────────────────────────────────────
# 1. Cụm phải pull được image private từ ghcr:
#      kubectl create secret docker-registry ghcr-secret -n bizflow \
#        --docker-server=ghcr.io --docker-username=<user> \
#        --docker-password=<PAT scope read:packages>
#    (hoặc để package sang public thì khỏi cần)
# 2. Image này chạy Next.js standalone bằng `node server.js`. Nếu Deployment
#    đang khai `command:`/`args:` kiểu `npm start` hay `next start` thì PHẢI bỏ đi,
#    nếu không container sẽ không khởi động được.

name: deploy

# ⚠️ ĐANG TẮT TỰ ĐỘNG. Deploy thật hiện chạy từ repo `ke-truyen`
# (workflow `deploy-blog`), vì bộ secret SSH vào cụm chỉ có ở đó và repo đó
# public nên Actions miễn phí. Repo này private, mỗi lần chạy đều trừ vào
# hạn mức 2.000 phút/tháng.
#
# Workflow này chỉ chạy khi bấm tay, và CHỈ chạy được sau khi đã khai đủ
# các secret liệt kê ở trên. Chưa có thì nó sẽ dừng ở bước deploy.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: tradadata-blog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Repo chưa có test tự động. Typecheck là cổng chắn thật sự ở đây —
  # next.config.ts bật `typescript.ignoreBuildErrors` nên `next build` KHÔNG
  # chặn lỗi type, phải kiểm riêng.
  # Cố ý không chạy eslint: repo đang có sẵn ~37 lỗi no-explicit-any, bật lên là
  # đỏ vĩnh viễn. Dọn xong thì thêm bước lint vào đây.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit

  build-push:
    needs: check
    # Không build Docker khi mở PR — build image Next.js tốn vài phút mỗi lần,
    # trong khi hạn mức Actions của tài khoản chỉ có 2.000 phút/tháng.
    # PR vẫn được chặn bởi job `check` (typecheck) ở trên.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Đăng nhập ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tính tên image (ghcr yêu cầu chữ thường)
        id: meta
        run: |
          REPO_LC=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${REPO_LC}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "repo_lc=${REPO_LC}" >> "$GITHUB_OUTPUT"

      - name: Ghi service role key ra file để mount làm BuildKit secret
        run: |
          printf '%s' "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" > /tmp/supabase_srk
          chmod 600 /tmp/supabase_srk

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NEXT_PUBLIC_APP_URL=https://www.tradadata.com
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SERVICE_ACCOUNT_EMAIL=${{ secrets.NEXT_PUBLIC_SERVICE_ACCOUNT_EMAIL }}
            APP_VERSION=${{ github.sha }}
          secret-files: |
            supabase_service_role_key=/tmp/supabase_srk
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_lc }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_lc }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dọn secret tạm
        if: always()
        run: rm -f /tmp/supabase_srk

  deploy:
    needs: build-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Không được huỷ giữa lúc rollout đang chạy, sẽ để cụm ở trạng thái nửa vời.
    # Dùng CHUNG group với ke-truyen: hai repo deploy vào cùng 1 pod, chạy
    # song song là giẫm chân nhau.
    concurrency:
      group: ke-truyen-deploy-cum
      cancel-in-progress: false
    environment:
      name: production
      url: https://www.tradadata.com
    env:
      NAMESPACE: bizflow
      DEPLOYMENT: tradadata
      CONTAINER: blog
      IMAGE: ${{ needs.build-push.outputs.image }}
    steps:
      - name: Chuẩn bị SSH (ProxyJump qua gateway public vào LAN)
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ci_key
          chmod 600 ~/.ssh/ci_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host gw
            HostName ${{ secrets.SSH_GATEWAY }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/ci_key
            IdentitiesOnly yes
          Host cp
            HostName ${{ secrets.K8S_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/ci_key
            IdentitiesOnly yes
            ProxyJump gw
          EOF
          chmod 600 ~/.ssh/config

      - name: Đổi image + chờ rollout
        run: |
          echo "deploy $IMAGE"
          ssh cp "kubectl set image deployment/$DEPLOYMENT $CONTAINER=$IMAGE -n $NAMESPACE"
          ssh cp "kubectl rollout status deployment/$DEPLOYMENT -n $NAMESPACE --timeout=10m"

      # Rollout xong không có nghĩa là code mới đang phục vụ. Bước này mới là
      # bằng chứng: /api/health trả về APP_VERSION được nướng vào image lúc build,
      # đối chiếu đúng bằng commit SHA thì mới coi là deploy thành công.
      - name: Nghiệm thu — xác nhận đúng commit đang chạy
        run: |
          EXPECTED="${{ github.sha }}"
          echo "chờ /api/health trả version=$EXPECTED"
          for i in $(seq 1 30); do
            GOT=$(curl -sS -m 10 https://www.tradadata.com/api/health | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
            echo "  lần $i: version=${GOT:-<không đọc được>}"
            if [ "$GOT" = "$EXPECTED" ]; then
              echo "OK — commit $EXPECTED đã thực sự phục vụ"
              exit 0
            fi
            sleep 10
          done
          echo "THẤT BẠI: sau 5 phút site vẫn không trả đúng commit."
          ssh cp "kubectl get pods -n $NAMESPACE -l app=$DEPLOYMENT"
          ssh cp "kubectl logs -n $NAMESPACE deploy/$DEPLOYMENT -c $CONTAINER --tail=50"
          exit 1

      - name: Báo cáo
        if: always()
        run: |
          ssh cp "kubectl get deploy $DEPLOYMENT -n $NAMESPACE -o jsonpath='{range .spec.template.spec.containers[*]}{.name}={.image}{\"\n\"}{end}'" || true

      - name: Dọn
        if: always()
        run: rm -f ~/.ssh/ci_key
