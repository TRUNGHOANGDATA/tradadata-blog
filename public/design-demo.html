<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trà Đá Data - Design Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --bg: #f8fafc;
      --bg2: #fff;
      --text: #0f172a;
      --text2: #334155;
      --text3: #64748b;
      --border: #e2e8f0;
      --accent: #635bff;
      --accent2: #00d4aa;
      --accent-h: #5851db;
      --card-bg: #fff;
      --hero-from: #f0fdf4;
      --hero-to: #f8fafc;
      --nl-from: #10b981;
      --nl-to: #059669;
      --ft-bg: #0f172a;
      --ft-t: #94a3b8;
      --ft-h: #f1f5f9;
      --glow: rgba(99, 91, 255, .06)
    }

    .dark {
      --bg: #0b0f1a;
      --bg2: #111827;
      --text: #e2e8f0;
      --text2: #c9d1d9;
      --text3: #8b949e;
      --border: rgba(255, 255, 255, .08);
      --accent: #818cf8;
      --accent2: #34d399;
      --accent-h: #a5b4fc;
      --card-bg: #1e293b;
      --hero-from: #0f172a;
      --hero-to: #0b0f1a;
      --nl-from: #059669;
      --nl-to: #047857;
      --ft-bg: #060a13;
      --ft-t: #8b949e;
      --ft-h: #e2e8f0;
      --glow: rgba(129, 140, 248, .06)
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text2);
      transition: background .3s, color .3s
    }

    /* SWITCHER */
    .sw {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      background: rgba(0, 0, 0, .95);
      backdrop-filter: blur(20px);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, .1)
    }

    .sw span {
      font-size: 11px;
      color: #888;
      margin-right: 6px;
      font-weight: 700
    }

    .sw b {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, .12);
      background: transparent;
      color: #aaa;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: .2s
    }

    .sw b:hover {
      border-color: #fff;
      color: #fff
    }

    .sw b.on {
      background: #fff;
      color: #000;
      border-color: #fff
    }

    .pg {
      display: none;
      padding-top: 44px
    }

    .pg.on {
      display: block
    }

    /* HEADER - matches original */
    .hdr {
      position: sticky;
      top: 44px;
      z-index: 100;
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 32px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      transition: all .3s
    }

    .hi {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none
    }

    .logo img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover
    }

    .logo strong {
      font-size: 16px;
      font-weight: 800;
      color: var(--text)
    }

    nav {
      display: flex;
      gap: 4px;
      margin-left: 32px
    }

    nav a {
      text-decoration: none;
      color: var(--text3);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 8px;
      transition: .2s
    }

    nav a:hover {
      color: var(--text);
      background: var(--glow)
    }

    .hr {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .search-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text3);
      font-size: 12px;
      cursor: pointer;
      font-family: inherit
    }

    .search-btn kbd {
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-size: 10px;
      font-family: inherit
    }

    .ib {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: .2s
    }

    .ib:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .login-btn {
      padding: 8px 20px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px
    }

    /* FOOTER - matches original 4-col */
    .ft {
      background: var(--ft-bg);
      padding: 48px 32px 20px
    }

    .fi {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.6fr 1fr 1fr 1fr;
      gap: 40px
    }

    .fl {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px
    }

    .fl img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover
    }

    .fl strong {
      font-size: 15px;
      font-weight: 700;
      color: var(--ft-h)
    }

    .ft .desc {
      font-size: 13px;
      color: var(--ft-t);
      line-height: 1.7
    }

    .ft h4 {
      font-size: 13px;
      font-weight: 700;
      color: var(--ft-h);
      margin-bottom: 14px
    }

    .ft-link {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-size: 13px;
      color: var(--ft-t);
      padding: 4px 0;
      transition: .2s
    }

    .ft-link:hover {
      color: var(--accent)
    }

    .fb {
      max-width: 1200px;
      margin: 28px auto 0;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, .06);
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--ft-t);
      opacity: .6
    }

    /* NEWSLETTER - matches original green box */
    .nl-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 32px
    }

    .nl {
      border-radius: 20px;
      padding: 48px;
      background: linear-gradient(135deg, var(--nl-from), var(--nl-to));
      text-align: center
    }

    .nl h3 {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px
    }

    .nl>p {
      font-size: 14px;
      color: rgba(255, 255, 255, .8);
      margin-bottom: 24px;
      line-height: 1.6
    }

    .nl-form {
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .nl-form input {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .2);
      background: rgba(255, 255, 255, .15);
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      backdrop-filter: blur(8px)
    }

    .nl-form input::placeholder {
      color: rgba(255, 255, 255, .6)
    }

    .nl-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .nl-form button {
      padding: 14px;
      border-radius: 10px;
      border: 2px solid #fff;
      background: transparent;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: .2s
    }

    .nl-form button:hover {
      background: #fff;
      color: #059669
    }

    /* CARD - matches original */
    .cg {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px
    }

    .pc {
      border-radius: 16px;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: .3s
    }

    .pc:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, .1)
    }

    .pi {
      height: 200px;
      background-size: cover;
      background-position: center;
      position: relative
    }

    .pi .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(16, 185, 129, .9);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 4px
    }

    .pb {
      padding: 16px
    }

    .ptag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 8px
    }

    .pb h4 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 6px
    }

    .pb p {
      font-size: 13px;
      color: var(--text3);
      line-height: 1.5;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden
    }

    .pmeta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: var(--text3)
    }

    /* FLOATING */
    .flt {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 99;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .fbt {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: .25s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .2);
      overflow: hidden
    }

    .fbt:hover {
      transform: scale(1.1)
    }

    .fbt-z {
      background: #0068ff;
      color: #fff;
      font-size: 11px;
      font-weight: 900
    }

    .fbt-m {
      background: linear-gradient(135deg, #0099FF, #a033ff);
      color: #fff;
      font-size: 20px
    }

    /* ===== BLOG LIST PAGE ===== */
    .bl-hero {
      padding: 40px 0 24px;
      background: linear-gradient(to bottom, var(--hero-from), var(--hero-to))
    }

    .bl-hero h1 {
      font-size: 32px;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 4px
    }

    .bl-hero p {
      font-size: 15px;
      color: var(--text3)
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap
    }

    .filter-bar .search-filter {
      flex: 0 0 280px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none
    }

    .filter-bar .search-filter::placeholder {
      color: var(--text3)
    }

    .fb-sep {
      width: 1px;
      height: 24px;
      background: var(--border)
    }

    .fb-tag {
      padding: 8px 16px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text3);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: .2s;
      display: flex;
      align-items: center;
      gap: 4px
    }

    .fb-tag:hover {
      color: var(--text);
      background: var(--glow)
    }

    .fb-tag.on {
      background: var(--accent);
      color: #fff
    }

    .pg-nav {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 32px
    }

    .pg-nav button {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text3);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: .2s
    }

    .pg-nav button.on {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent)
    }

    /* ===== BLOG DETAIL ===== */
    .art-hero {
      position: relative;
      height: 380px;
      overflow: hidden;
      background-size: cover;
      background-position: center
    }

    .art-hero .ov {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, .85), rgba(0, 0, 0, .3))
    }

    .art-hero .cont {
      position: absolute;
      bottom: 40px;
      left: 0;
      right: 0;
      z-index: 2;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 32px;
      text-align: center
    }

    .art-bc {
      display: flex;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      color: rgba(255, 255, 255, .5);
      margin-bottom: 14px
    }

    .art-bc a {
      color: rgba(255, 255, 255, .6);
      text-decoration: none
    }

    .art-bc a:hover {
      color: #fff
    }

    .art-cat {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(16, 185, 129, .2);
      color: #4ade80;
      border: 1px solid rgba(16, 185, 129, .3);
      margin-bottom: 12px
    }

    .art-hero h1 {
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 12px
    }

    .art-author {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: rgba(255, 255, 255, .6)
    }

    .art-author .av {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 11px;
      font-weight: 700
    }

    .art-tags-top {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 10px
    }

    .art-tags-top span {
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(255, 255, 255, .1);
      color: rgba(255, 255, 255, .6)
    }

    /* 3-col layout: share | content | sidebar */
    .art-layout {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px;
      display: grid;
      grid-template-columns: 60px 1fr 280px;
      gap: 24px
    }

    .share-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: sticky;
      top: 120px;
      align-self: start
    }

    .share-col a,
    .share-col button {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      transition: .2s
    }

    .share-col a:hover,
    .share-col button:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .share-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text3);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 4px
    }

    .content-col {
      min-width: 0
    }

    .excerpt-box {
      padding: 16px 20px;
      border-left: 3px solid var(--accent);
      background: var(--glow);
      border-radius: 0 10px 10px 0;
      margin-bottom: 24px;
      font-style: italic;
      color: var(--text2);
      font-size: 14px;
      line-height: 1.7
    }

    .prose h2 {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      margin: 24px 0 10px
    }

    .prose p {
      font-size: 15px;
      line-height: 1.8;
      color: var(--text2);
      margin-bottom: 14px
    }

    .prose ul {
      margin: 0 0 14px 20px
    }

    .prose li {
      margin-bottom: 4px;
      font-size: 14px;
      color: var(--text2)
    }

    .prose pre {
      background: #1e1e2e;
      border-radius: 10px;
      padding: 16px;
      margin: 14px 0;
      overflow-x: auto
    }

    .prose code {
      font-family: 'Fira Code', monospace;
      font-size: 13px
    }

    .prose pre code {
      color: #cdd6f4
    }

    .tag-list {
      display: flex;
      gap: 6px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border)
    }

    .tag-list a {
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: var(--glow);
      text-decoration: none;
      border: 1px solid var(--border)
    }

    .premium-lock {
      text-align: center;
      padding: 32px;
      background: var(--glow);
      border-radius: 16px;
      margin: 20px 0;
      border: 1px solid var(--border)
    }

    .premium-lock .lock-icon {
      font-size: 40px;
      margin-bottom: 12px
    }

    .premium-lock h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px
    }

    .premium-lock p {
      font-size: 13px;
      color: var(--text3);
      margin-bottom: 16px
    }

    .premium-lock a {
      display: inline-block;
      padding: 10px 24px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600
    }

    .sidebar {
      position: sticky;
      top: 120px;
      align-self: start;
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    .toc-box {
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg2)
    }

    .toc-box h5 {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .toc-box a {
      display: block;
      font-size: 12px;
      color: var(--text3);
      text-decoration: none;
      padding: 5px 0;
      transition: .2s
    }

    .toc-box a:hover,
    .toc-box a.on {
      color: var(--accent)
    }

    .course-promo {
      padding: 16px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--hero-from), var(--glow));
      border: 1px solid var(--border)
    }

    .course-promo h5 {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 6px
    }

    .course-promo h4 {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px
    }

    .course-promo p {
      font-size: 12px;
      color: var(--text3);
      margin-bottom: 10px;
      line-height: 1.5
    }

    .course-promo a {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none
    }

    /* Comments */
    .comments {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 32px 32px
    }

    .comments h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .comment-login {
      text-align: center;
      padding: 24px;
      background: var(--bg2);
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 16px
    }

    .comment-login p {
      font-size: 13px;
      color: var(--text3);
      margin-bottom: 10px
    }

    .comment-login a {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600
    }

    .comment-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--border)
    }

    .comment-item .av {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0
    }
